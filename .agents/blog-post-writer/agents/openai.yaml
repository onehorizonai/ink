interface:
  display_name: "Blog Post Writer"
  short_description: "Research and draft blog posts in two passes"
  default_prompt: "Use $blog-post-writer to resolve the active Ink profile, then first ask or confirm the general blog post type with the user, normalize broad labels to the nearest playbook when needed, and do not start internal research, external research, outlining, or drafting until the user confirms or corrects that type. Then research that profile's blog corpus, outline, write in two passes, and run the six mandatory review passes in order. Do not call the article final until you report a Review Ledger covering Humanizer, Style review, Fact check, Source URL check, Tone review, and Ramsay review, with the Ramsay verdict, score, and Must Fix items resolved or explicitly waived."
