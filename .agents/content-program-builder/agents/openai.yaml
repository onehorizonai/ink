interface:
  display_name: "Content Program Builder"
  short_description: "Create repeatable multi-channel Ink programs"
  default_prompt: "Use $content-program-builder to design or update a repeatable Ink Content Program for any marketing channel or production surface, with channel taxonomy, routes, formats, workflow docs, calendar tracking, and performance tracking. Before creating any new program pack, ask whether it should be local/private or public/tracked as part of the open-source repo."
